version: '3.8'

# ==============================================================================
# OBSERVABILITY STACK: FULL LGTM + PYROSCOPE
# ==============================================================================

services:

  # --- INGESTION: OpenTelemetry Collector ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: otel-collector
    user: "0:0"
    command: [ "--config=/etc/otel-config.yaml" ]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./config/otel-config.yaml:/etc/otel-config.yaml:ro
      - otel-data:/var/lib/otelcol/persistence
    networks:
      - observability
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

  # --- STORAGE: Metrics (Prometheus) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      # REQUIRED: Allows Tempo's Metrics-Generator to push data here
      - '--web.enable-remote-write-receiver'
      # REQUIRED: Allows clicking "dots" on graphs to see Traces
      - '--enable-feature=exemplar-storage'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus_rules:/etc/prometheus/prometheus_rules:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    restart: unless-stopped

  # --- STORAGE: Logs (Loki) ---
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    user: "0:0"
    command: [ "-config.file=/etc/loki/loki-config.yaml", "-config.expand-env=true" ]
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/var/loki
    env_file: .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    networks:
      - observability
    restart: unless-stopped

  # --- STORAGE: Traces (Tempo) ---
  tempo:
    image: grafana/tempo:2.10.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml", "-config.expand-env=true" ]
    ports:
      - "3200:3200" # HTTP API
      - "7946:7946" # Gossip Ring (FIXES: "empty ring" error for TraceQL)
    volumes:
      - ./config/tempo-config.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    env_file: .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    networks:
      - observability
    restart: unless-stopped

  # --- STORAGE: Profiles (Pyroscope) ---
  pyroscope:
    image: grafana/pyroscope:latest
    container_name: pyroscope
    command: [ "server", "-target=all", "-auth.multitenancy-enabled=false" ]
    ports:
      - "4040:4040" # Pyroscope UI and ingestion
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    networks:
      - observability
    restart: unless-stopped

  # --- INFRASTRUCTURE: Node Exporter & cAdvisor ---
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /:/host:ro,rslave
    networks:
      - observability
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - observability
    restart: unless-stopped

  # --- VISUALIZATION: Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=grafana-pyroscope-app
    networks:
      - observability
    depends_on:
      - loki
      - prometheus
      - tempo
      - pyroscope
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  tempo-data:
  loki-data:
  otel-data:
  pyroscope-data:
    # New volume for profiling data

networks:
  observability:
    driver: bridge
    name: observability
