# ==============================================================================
# GLOBAL CONFIGURATION
# ==============================================================================
auth_enabled: false

# ==============================================================================
# SERVER CONFIGURATION
# Defines the networking and logging behavior of the Loki process.
# ==============================================================================
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

# ==============================================================================
# COMMON SETTINGS
# Shared configurations used by multiple Loki components (Ingester, Querier, etc.)
# ==============================================================================
common:
  # instance_addr: 0.0.0.0
  path_prefix: /var/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      bucketnames: org-observability-loki-logs
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1
      # access_key_id: ${AWS_ACCESS_KEY_ID}
      # secret_access_key: ${AWS_SECRET_ACCESS_KEY}
      s3forcepathstyle: false

# ==============================================================================
# INGESTER CONFIGURATION
# Manages the lifecycle of incoming log streams in memory before flushing to S3.
# ==============================================================================
ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1m
  chunk_block_size: 262144
  chunk_encoding: snappy
  chunk_retain_period: 30s
  max_chunk_age: 2m
  wal:
    dir: /var/loki/wal

# ==============================================================================
# SCHEMA CONFIGURATION
# Defines the internal data structure and storage engine for logs and indexes.
# ==============================================================================
schema_config:
  configs:
  - from: "2024-01-01"
    store: tsdb
    object_store: s3
    schema: v13
    index:
      prefix: index_
      period: 24h

# ==============================================================================
# STORAGE CONFIGURATION
# Manages how the TSDB index files are shipped and cached locally.
# ==============================================================================
storage_config:
  tsdb_shipper:
    active_index_directory: /var/loki/index
    cache_location: /var/loki/cache

# ==============================================================================
# LIMITS & RETENTION POLICY
# Sets operational boundaries and how long data remains in the system.
# ==============================================================================
limits_config:
  retention_period: 336h # 14 Days
  allow_structured_metadata: true

# ==============================================================================
# COMPACTOR CONFIGURATION
# Handles deduplication and applies the retention policy to S3 storage.
# ==============================================================================
compactor:
  working_directory: /var/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: s3
