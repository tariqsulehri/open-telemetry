apiVersion: 1

datasources:
# ================================
# 1. PROMETHEUS (Metrics)
# ================================
- name: Prometheus
  type: prometheus
  uid: prometheus
  url: http://prometheus:9090
  access: proxy
  isDefault: true
  jsonData:
    httpMethod: POST
    exemplarTraceIdDest:
      datasourceUid: tempo
      name: trace_id

# ================================
# 2. LOKI (Logs)
# ================================
- name: Loki
  type: loki
  uid: loki
  url: http://loki:3100
  access: proxy
  jsonData:
    derivedFields:
    # ✅ ARCHITECT TIP: This links Loki Logs to Tempo Traces
    - datasourceUid: tempo
      matcherRegex: "trace_id=(\\w+)"
      name: TraceID
      url: "$${__value.raw}"

# ================================
# 3. TEMPO (Traces) - Replaces Jaeger
# ================================
- name: Tempo
  type: tempo
  uid: tempo
  url: http://tempo:3200
  access: proxy
  jsonData:
    httpMethod: GET
    # This allows Tempo to find the relevant logs for a trace
    lokiSearch:
      datasourceUid: loki
    serviceMap:
      datasourceUid: prometheus
