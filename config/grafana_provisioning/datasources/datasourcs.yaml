apiVersion: 1

datasources:
- name: Prometheus
  type: prometheus
  uid: prometheus
  url: http://prometheus:9090
  isDefault: true

- name: Loki
  type: loki
  uid: loki
  url: http://loki:3100
  jsonData:
    derivedFields:
    - name: TraceID
      datasourceUid: tempo
      # For structured metadata, we use the label name directly
      matcherRegex: "(.*)"
      sourceField: "traceID" # <--- THIS is the key for Loki 3.0
      urlLabel: "View Trace in Tempo"
      internalLink: true

- name: Tempo
  type: tempo
  uid: tempo
  url: http://tempo:3200
  jsonData:
    lokiSearch:
      datasourceUid: loki
    serviceMap:
      datasourceUid: prometheus
