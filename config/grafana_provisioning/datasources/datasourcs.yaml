apiVersion: 1

datasources:
- name: Prometheus
  type: prometheus
  uid: prometheus
  url: http://prometheus:9090
  isDefault: true

- name: Loki
  type: loki
  uid: loki
  url: http://loki:3100
  jsonData:
    derivedFields:
    # Correlation: Links Log TraceID to Tempo Trace
    - datasourceUid: tempo
      matcherRegex: "trace_id=(\\w+)"
      name: TraceID
      url: "$${__value.raw}"

- name: Tempo
  type: tempo
  uid: tempo
  url: http://tempo:3200
  jsonData:
    lokiSearch:
      datasourceUid: loki
    serviceMap:
      datasourceUid: prometheus
