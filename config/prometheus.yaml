# ===========================
# Global Settings
# ===========================
global:
  scrape_interval: 15s # how often to scrape metrics
  evaluation_interval: 15s # how often to evaluate rules
  external_labels:
    cluster: 'production'
    environment: 'prod'

# ===========================
# Scrape Prometheus itself
# ===========================
scrape_configs:
- job_name: 'prometheus'
  static_configs:
  - targets: [ 'prometheus:9090' ]

# Loki metrics
- job_name: 'loki'
  static_configs:
  - targets: [ 'loki:3100' ]

# ===========================
# Scrape cAdvisor (Docker container stats)
# ===========================
# - job_name: 'cadvisor'
#   static_configs:
#   - targets: [ 'cadvisor:8080' ]

# ===========================
# Scrape Node Exporter (host metrics)
# ===========================
- job_name: 'node-exporter'
  static_configs:
  - targets: [ 'node-exporter:9100' ]

- job_name: 'grafana'
  static_configs:
  - targets: [ 'grafana:3000' ]

# ===========================
# Scrape OpenTelemetry Collector
# ===========================
- job_name: 'otel-collector'
  static_configs:
  - targets: [ 'otel-collector:8889' ]
