receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
      - job_name: 'node-exporter'
        scrape_interval: 15s
        static_configs:
        - targets: [ 'node-exporter:9100' ]

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resource:
    attributes:
    - action: insert
      key: loki.resource.labels
      value: service.name

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # ARCHITECT TIP: File storage is critical for "Persistence Plane"
  # It prevents data loss if Tempo or Loki restarts.
  file_storage:
    directory: /var/lib/otelcol/persistence
    timeout: 10s

exporters:
  debug:
    verbosity: detailed

  # ✅ UPDATED: Replaced Jaeger with Tempo
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage # Links to the extension above

  prometheus:
    endpoint: "0.0.0.0:8889"

  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    sending_queue:
      enabled: true
      storage: file_storage

service:
  # ✅ UPDATED: Reactivated file_storage
  extensions: [ health_check, file_storage ]
  telemetry:
    metrics:
      level: detailed
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/tempo ] # Matches the new Tempo exporter

    metrics:
      receivers: [ otlp, prometheus ]
      processors: [ batch ]
      exporters: [ prometheus ]

    logs:
      receivers: [ otlp ]
      processors: [ batch, resource ]
      exporters: [ debug, loki ]
