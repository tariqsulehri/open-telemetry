# ==============================================================================
# RECEIVERS
# Defines how telemetry data enters the Collector.
# ==============================================================================
receivers:
  # OTLP: The standard OpenTelemetry protocol for app-generated telemetry
  # This is the primary ingestion method for traces, metrics, and logs from your apps.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317 # Default gRPC port (performance)
      http:
        endpoint: 0.0.0.0:4318 # Default HTTP port (web/browser clients)

  # Prometheus: Scrapes infrastructure metrics from Node Exporter
  # Acts as a proxy, scraping Prometheus targets and converting them to OTLP format internally.
  prometheus:
    config:
      scrape_configs:
      - job_name: 'node-exporter'
        scrape_interval: 15s
        static_configs:
        - targets: [ 'node-exporter:9100' ]

# ==============================================================================
# CONNECTORS
# Bridges data between pipelines (e.g., converting Traces into Metrics).
# ==============================================================================
connectors:
  servicegraph:
    metrics_flush_interval: 15s
    latency_histogram_buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s]
    dimensions:
      - service.name

  spanmetrics:
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets: [0.1s, 0.25s, 0.5s, 1s, 2s, 5s]
    dimensions:
      # - name: span.kind
      - name: http.method
      - name: http.route
      - name: http.status_code


# ==============================================================================
# PROCESSORS
# Logic to transform, batch, and enrich data before exporting.
# ==============================================================================
processors:
  # Performance: Buffers data to reduce network requests
  # Essential for production to prevent overwhelming the exporters.
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Labeling: Injects metadata into log entries for Loki indexing
  # Ensures that logs have the necessary labels for efficient querying in Loki.
  resource:
    attributes:
    - action: insert
      key: loki.resource.labels
      value: service.name, deployment.environment

  # Transformation: Normalizes log levels and links TraceIDs for correlation
  transform:
    log_statements:
    - context: log
      statements:
      - set(attributes["level"], severity_text) # Fixes "unknown level" in Grafana
      - set(attributes["traceID"], trace_id.string) # Enables Log-to-Trace jumps (correlation)

# ==============================================================================
# EXTENSIONS
# Supporting features like health monitoring and persistent storage.
# ==============================================================================
extensions:
  # Health Check: Endpoint for container orchestration readiness probes
  health_check:
    endpoint: 0.0.0.0:13133

  # File Storage: Buffer plane to prevent data loss during backend outages
  # If an exporter fails, data is queued here instead of being dropped.
  file_storage:
    directory: /var/lib/otelcol/persistence
    timeout: 10s

# ==============================================================================
# EXPORTERS
# Defines the destinations where processed telemetry is sent.
# ==============================================================================
exporters:
  # Debug: Prints detailed telemetry to stdout for troubleshooting
  # Useful for verifying that data is actually reaching the collector.
  debug:
    verbosity: detailed

  # Tempo: Backend for distributed tracing (S3 persistent)
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage # Use persistent storage for the queue

  # Prometheus: Exposes metrics for the Prometheus scraper
  # The Collector acts as a server here, allowing Prometheus to scrape it.
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  # Loki: Backend for structured log aggregation (S3 persistent)
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    sending_queue:
      enabled: true
      storage: file_storage # Use persistent storage for the queue

# ==============================================================================
# SERVICE (PIPELINES)
# Orchestrates how the components above are wired together.
# ==============================================================================
service:
  extensions: [ health_check, file_storage ]
  telemetry:
    metrics:
      level: detailed # Expose internal collector metrics
      address: 0.0.0.0:8888

  pipelines:
    # Trace Pipeline: App -> Collector -> (Tempo + Graph Generator)
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      # exporters: [ otlp/tempo, servicegraph ]
      exporters: [ otlp/tempo, servicegraph, spanmetrics ]

    # Metrics Pipeline: App/NodeExporter/ServiceGraph -> Prometheus
    metrics:
      receivers: [ otlp, prometheus, servicegraph, spanmetrics ]
      # receivers: [ otlp, prometheus ]
      processors: [ batch ]
      exporters: [ prometheus ]

    # Log Pipeline: App -> Enrichment -> (Loki + Debug)
    logs:
      receivers: [ otlp ]
      processors: [ transform, resource, batch ]
      exporters: [ debug, loki ]
