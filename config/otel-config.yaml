receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
      - job_name: 'node-exporter'
        scrape_interval: 15s
        static_configs:
        - targets: [ 'node-exporter:9100' ]

processors:
  batch:
    timeout: 1s
  resource:
    attributes:
    - action: insert
      key: loki.resource.labels
      value: service.name

exporters:
  debug:
    verbosity: detailed

  # ✅ FIXED: Corrected YAML syntax and named it otlp/jaeger
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [ health_check ] # 👈 Activate the extension
  telemetry:
    metrics:
      level: detailed # Options: basic, normal, detailed
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/jaeger ] # Matches the name above

    metrics:
      receivers: [ otlp, prometheus ]
      processors: [ batch ]
      exporters: [ prometheus ]

    logs:
      receivers: [ otlp ]
      processors: [ batch, resource ]
      exporters: [ debug, loki ]
