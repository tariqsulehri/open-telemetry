# ==============================================================================
# SERVER CONFIGURATION
# Defines the networking behavior for Tempo's API and internal communication.
# ==============================================================================
server:
  http_listen_port: 3200

# ==============================================================================
# DISTRIBUTOR CONFIGURATION
# The entry point for traces. Configured to receive OTLP data via gRPC.
# ==============================================================================
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# ==============================================================================
# INGESTER CONFIGURATION
# Batches traces in memory and manages the Write-Ahead Log (WAL) before flushing.
# ==============================================================================
ingester:
  lifecycler:
    ring:
      replication_factor: 1
      kvstore:
        store: inmemory
    final_sleep: 0s

# ==============================================================================
# STORAGE CONFIGURATION
# Defines the persistence layer. Configured for AWS S3 long-term storage.
# ==============================================================================
storage:
  trace:
    backend: s3
    s3:
      bucket: org-observability-tempo-traces
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1
      access_key: ${AWS_ACCESS_KEY_ID}
      secret_key: ${AWS_SECRET_ACCESS_KEY}
    wal:
      path: /var/tempo/wal

# ==============================================================================
# OVERRIDES & LIMITS
# Global limits and per-tenant settings to control ingestion volume.
# ==============================================================================
overrides:
  defaults:
    ingestion:
      max_traces_per_user: 10000
